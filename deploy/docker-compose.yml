services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: berry-intelligence-os:demo
    restart: unless-stopped
    environment:
      BIOS_REMOTE_INTERACTIVE: "true"
      BIOS_RUNTIME_DIR: /app/runtime
      BIOS_BACKUP_DIR: /app/backups
      BIOS_MODE: authoring
      ENABLE_SOURCE_POLLING: "false"
      BIOS_REVIEW_USERNAME: ${BIOS_REVIEW_USERNAME:?set BIOS_REVIEW_USERNAME in deploy/.env}
      BIOS_REVIEW_PASSWORD: ${BIOS_REVIEW_PASSWORD:?set BIOS_REVIEW_PASSWORD in deploy/.env}
      BIOS_SESSION_SECRET: ${BIOS_SESSION_SECRET:?set BIOS_SESSION_SECRET in deploy/.env}
      BIOS_BASIC_AUTH: ${BIOS_BASIC_AUTH:-false}
      BIOS_CANONICAL_SHA: ${BIOS_CANONICAL_SHA:-unknown}
      # Optional. AI-Assisted Report Builder V1's scope interpretation and
      # section synthesis (app/services/ai_gateway/untrusted_complete.py)
      # degrade gracefully to a deterministic fallback when unset -- never
      # required for the app to start. Never given a default value here;
      # an empty/unset deploy/.env entry means the feature simply stays
      # off, exactly like today.
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      # Single activation switch, read identically by app/main.py's routes
      # (Industry Pulse's manual "Run Pulse" button, Competitor Pulse V1's
      # live company queries) and scripts/industry_pulse_intake.py's
      # scheduled CLI. Defaults off (empty/unset = false) exactly like
      # PERPLEXITY_API_KEY above -- see docs/v2/COMPETITOR-PULSE-V1.md and
      # docs/v2/CONTINUOUS-NEWSROOM-INTAKE-V1.md for the activation
      # decisions recorded for each surface.
      ENABLE_PERPLEXITY_PULSE: ${ENABLE_PERPLEXITY_PULSE:-false}
    volumes:
      - ${BIOS_DEMO_RUNTIME:-../demo-runtime}/data:/app/runtime/data
      - ${BIOS_DEMO_RUNTIME:-../demo-runtime}/inbox:/app/runtime/inbox
      - ${BIOS_BACKUP_HOST_DIR:-/var/backups/berry-intelligence-os}:/app/backups
    expose:
      - "8000"
    ports:
      - "${BIOS_APP_BIND:-127.0.0.1}:${BIOS_APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 8

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${BIOS_HTTP_PORT:-80}:80"
      - "${BIOS_HTTPS_PORT:-443}:443"
    environment:
      BIOS_DEMO_SITE: ${BIOS_DEMO_SITE:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    profiles: ["tls"]

volumes:
  caddy-data:
  caddy-config:
