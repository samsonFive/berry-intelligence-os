{% if not static_build %}
<div class="offcanvas offcanvas-end v2-reader-offcanvas" tabindex="-1" id="v2ReaderOffcanvas" aria-labelledby="v2ReaderTitle">
  <div class="offcanvas-header">
    <h2 class="offcanvas-title" id="v2ReaderTitle">Reader</h2>
    <div class="v2-reader-nav">
      <button type="button" class="v2-btn v2-btn-quiet" id="v2ReaderPrev" aria-label="Previous item">Previous</button>
      <button type="button" class="v2-btn v2-btn-quiet" id="v2ReaderNext" aria-label="Next item">Next</button>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close reader"></button>
    </div>
  </div>
  <div class="offcanvas-body" id="v2ReaderBody">
    <p class="empty-state">Select an item to read.</p>
  </div>
</div>
{% endif %}
