{% if photo_gallery and authoring_mode and not static_build %}
<section class="variety-photo-gallery" aria-label="Variety photos">
{% for photo in photo_gallery %}<figure class="variety-photo">
{% if photo.display_image %}<div class="variety-photo-frame" data-variety-photo><img src="{{ photo.image_url }}" alt="{{ photo.caption }}" loading="lazy" decoding="async" referrerpolicy="no-referrer" width="320" height="200"><span hidden>Photo unavailable. View the original source below.</span></div>{% endif %}
<figcaption><b>{{ photo.named_variety }} · {{ photo.kind_label }}</b><p>{{ photo.caption }}</p><small>{{ photo.credit }}</small><small>{{ photo.origin }}</small><div><a href="{{ photo.source_url }}" target="_blank" rel="noopener noreferrer">Photo source ↗</a>{% if photo.license_url %} · <a href="{{ photo.license_url }}" target="_blank" rel="noopener noreferrer">{{ photo.reuse_label }} ↗</a>{% else %} · {{ photo.reuse_label }}{% endif %}</div><details><summary>Attribution & reuse details</summary><p>{{ photo.reuse_note or 'A source link is available; the photo stays hidden until reuse terms are recorded.' }}</p><small>Source checked {{ photo.checked_on }}</small><a href="{{ photo.image_url }}" target="_blank" rel="noopener noreferrer">Original image ↗</a></details></figcaption>
</figure>{% endfor %}
</section>{% endif %}
