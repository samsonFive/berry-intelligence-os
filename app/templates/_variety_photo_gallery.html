{% if photo_gallery and authoring_mode and not static_build %}
<section class="variety-photo-gallery" aria-label="Variety photos">
{% for photo in photo_gallery %}<figure class="variety-photo">
{% if photo.display_image %}<div class="variety-photo-frame" data-variety-photo><img src="{{ photo.image_url }}" alt="{{ photo.caption }}" loading="lazy" decoding="async" referrerpolicy="no-referrer" width="320" height="200"><span hidden>Photo unavailable. View the original source below.</span></div>{% else %}
<div data-photo-session data-image-url="{{ photo.image_url }}" data-source-url="{{ photo.source_url }}" data-caption="{{ photo.caption }}">
  <div class="variety-photo-frame" data-photo-session-frame hidden><span hidden>Photo unavailable. View the original source below.</span></div>
  <div class="variety-photo-session-controls"><button type="button" class="outline-button" data-photo-session-toggle aria-pressed="false" hidden>Ignore permission</button><small data-photo-session-status role="status">Permission unconfirmed · source link available</small><noscript>Enable JavaScript to load this photo for the session.</noscript></div>
</div>{% endif %}
<label class="variety-photo-zoom" data-photo-zoom hidden>Zoom <input type="range" min="1" max="5" step="0.5" value="1" aria-label="Zoom photo of {{ photo.named_variety }}"><output>1×</output></label>
<figcaption><b>{{ photo.named_variety }} · {{ photo.kind_label }}</b><p>{{ photo.caption }}</p><small>{{ photo.credit }}</small><small>{{ photo.origin }}</small><div><a href="{{ photo.source_url }}" target="_blank" rel="noopener noreferrer">Photo source ↗</a>{% if photo.license_url %} · <a href="{{ photo.license_url }}" target="_blank" rel="noopener noreferrer">{{ photo.reuse_label }} ↗</a>{% else %} · {{ photo.reuse_label }}{% endif %}</div><details><summary>Attribution & reuse details</summary><p>{{ photo.reuse_note or 'Permission has not been recorded. Open the source or preview this photo for this session.' }}</p><small>Source checked {{ photo.checked_on }}</small><a href="{{ photo.image_url }}" target="_blank" rel="noopener noreferrer">Original image ↗</a></details></figcaption>
</figure>{% endfor %}
</section>{% endif %}
