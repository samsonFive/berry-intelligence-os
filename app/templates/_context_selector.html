{% set ui = ui_context if ui_context is defined else {"berry": "global", "berry_label": "Global", "options": [], "feed_view": "grid"} %}
{% if static_build %}
  <p class="v2-context-static">{{ ui.berry_label }}</p>
{% else %}
<form class="v2-context" action="/ui/context" method="post">
  <input type="hidden" name="next" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
  <label class="visually-hidden" for="v2-berry">Berry context</label>
  <select id="v2-berry" name="berry" onchange="this.form.requestSubmit()">
    {% for option in ui.options %}
      <option value="{{ option.id }}" {% if ui.berry == option.id %}selected{% endif %}>{{ option.label }}</option>
    {% endfor %}
    <optgroup label="Company">
      <option disabled>All companies — coming later</option>
    </optgroup>
    <optgroup label="Geography">
      <option disabled>All geographies — coming later</option>
    </optgroup>
  </select>
  <input type="hidden" name="view" value="{{ ui.feed_view }}">
</form>
{% endif %}
