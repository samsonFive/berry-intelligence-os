{% macro icon(name) -%}
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'up' %}<path d="M7 10h3l3-7c3 0 3 3 2 6h4a2 2 0 0 1 2 2l-2 8a2 2 0 0 1-2 2H7z"/><path d="M3 10h4v11H3z"/>
{% elif name == 'down' %}<path d="M7 14h3l3 7c3 0 3-3 2-6h4a2 2 0 0 0 2-2l-2-8a2 2 0 0 0-2-2H7z"/><path d="M3 3h4v11H3z"/>
{% elif name == 'save' %}<path d="M4 3h14l3 3v15H3V3z"/><path d="M7 3v6h10V3M7 21v-8h10v8"/>
{% elif name == 'newspaper' %}<path d="M4 4h16v16H4zM4 8H2v12a2 2 0 0 0 2 2h16"/><path d="M7 7h5v5H7zM15 7h2M15 11h2M7 15h10M7 18h10"/>
{% elif name == 'check' %}<path d="m5 12 4 4L20 5"/>
{% endif %}</svg>
{%- endmacro %}
{% macro action_icon(card, action, label, symbol, selected=false) -%}
<button type="button" class="icon-action{% if selected %} selected{% endif %}" data-personal-action="{{ action }}" data-item-id="{{ card.id }}" aria-label="{{ label }}" aria-pressed="{{ 'true' if selected else 'false' }}" {% if not authoring_mode %}disabled{% endif %}>{{ icon(symbol) }}<span class="action-tooltip" role="tooltip">{{ label }}</span></button>
{%- endmacro %}
