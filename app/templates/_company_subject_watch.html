{% if authoring_mode and company.canonical and company.entity_type == 'company' %}<form method="post" action="/watches/toggle"><input type="hidden" name="watch_type" value="company"><input type="hidden" name="object_id" value="{{ entity_id }}"><input type="hidden" name="action" value="{{ 'remove' if is_subject_watched else 'add' }}"><input type="hidden" name="return_to" value="{{ return_to }}"><button class="outline-button" {% if subject_watch_error %}disabled{% endif %}>{{ 'Remove subject watch' if is_subject_watched else 'Watch this company' }}</button></form><a href="/monitor?company={{ entity_id }}">Monitor changes →</a>{% if subject_watch_error %}<p class="company-muted" role="status">{{ subject_watch_error }}</p>{% endif %}{% endif %}
