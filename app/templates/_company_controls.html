{% macro tracking(row, return_to) %}
{% if authoring_mode %}<div class="company-tracking">
<form action="/companies/{{ row.id }}/marks" method="post"><input type="hidden" name="return_to" value="{{ return_to }}"><input type="hidden" name="action" value="favorite"><input type="hidden" name="value" value="{{ '0' if row.favorite else '1' }}"><button class="company-star{% if row.favorite %} selected{% endif %}" type="submit" aria-pressed="{{ 'true' if row.favorite else 'false' }}" aria-label="{{ 'Remove favorite' if row.favorite else 'Favorite' }} {{ row.name }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.4-5.7-3-5.7 3 1.1-6.4-4.6-4.5 6.4-.9Z"/></svg><span class="action-tooltip" role="tooltip">{{ 'Remove favorite' if row.favorite else 'Add favorite' }}</span></button></form>
<form action="/companies/{{ row.id }}/marks" method="post" class="company-tier-form"><input type="hidden" name="return_to" value="{{ return_to }}"><input type="hidden" name="action" value="tier"><label class="visually-hidden" for="tier-{{ row.id }}">Tier for {{ row.name }}</label><select id="tier-{{ row.id }}" name="value">{% for key,label in row.tier_choices.items() %}<option value="{{ key }}" {% if row.tier == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button type="submit" aria-label="Save tier for {{ row.name }}">Save</button></form>
<details class="company-membership"><summary>Lists · {{ row.lists|length }}</summary><div>{% for group in lists %}{% set joined = row.id in group.company_ids %}<form action="/companies/{{ row.id }}/marks" method="post"><input type="hidden" name="return_to" value="{{ return_to }}"><input type="hidden" name="action" value="{{ 'leave' if joined else 'join' }}"><input type="hidden" name="value" value="{{ group.id }}"><span>{{ group.name }}</span><button type="submit" aria-label="{{ 'Remove' if joined else 'Add' }} {{ row.name }} {{ 'from' if joined else 'to' }} {{ group.name }}">{{ 'Remove' if joined else 'Add' }}</button></form>{% else %}<p>Create a company list below.</p>{% endfor %}</div></details>
</div>{% else %}<span>{{ row.tier_label }}</span>{% endif %}
{% endmacro %}
