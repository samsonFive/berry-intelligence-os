<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Berry Intelligence OS</title>
  <link rel="stylesheet" href="/static/app.css?v=login-layout">
  <style>
    html, body.login-body {
      height: 100%;
    }
    body.login-body {
      min-height: 100vh;
      margin: 0;
      background: #071934;
      color: #e8eef8;
      position: relative;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    .login-motif {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      overflow: hidden;
      pointer-events: none;
      color: rgba(180, 204, 240, 0.18);
    }
    .login-motif svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .login-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #f5f7fb;
      color: #14213d;
      border-radius: 16px;
      padding: 36px 32px 28px;
      box-shadow: 0 24px 60px rgba(4, 16, 40, 0.35);
      border: 1px solid rgba(220, 230, 245, 0.12);
    }
    .login-brand {
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.02em;
      color: #08234d;
      margin: 0 0 18px;
    }
    .login-brand span {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
      letter-spacing: 0.12em;
    }
    .login-card h1 {
      margin: 0 0 8px;
      font-size: 26px;
      color: #152443;
    }
    .login-lead {
      margin: 0 0 22px;
      color: #536076;
      line-height: 1.5;
    }
    .login-card .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
    }
    .login-card .form-field label {
      font-weight: 700;
      font-size: 13px;
      color: #3c4a63;
    }
    .login-card input[type="text"],
    .login-card input[type="password"] {
      width: 100%;
      max-width: 100%;
      display: block;
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #d3dbe8;
      border-radius: 8px;
      padding: 11px 12px;
      font: inherit;
      color: #14213d;
    }
    .login-card input:focus,
    .login-card input:focus-visible {
      outline: 2px solid #6d50c7;
      outline-offset: 1px;
      border-color: #6d50c7;
    }
    .login-submit {
      width: 100%;
      margin-top: 6px;
      background: #6d50c7;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .login-submit:hover {
      background: #5a41b0;
    }
    .login-submit:focus-visible {
      outline: 2px solid #6d50c7;
      outline-offset: 2px;
    }
    .login-error {
      background: #fdeaea;
      color: #a3271f;
      border: 1px solid #f4c6c2;
      border-radius: 8px;
      padding: 10px 12px;
      margin: 0 0 16px;
      font-size: 14px;
    }
    .login-foot {
      margin: 18px 0 0;
      text-align: center;
      color: #7d8799;
      font-size: 13px;
    }
    .login-motif-copy {
      margin: 22px 0 0;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      color: #9db4d6;
    }
    @media (max-width: 834px) {
      .login-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body class="login-body">
  <div class="login-motif" aria-hidden="true">
    <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" focusable="false">
      <g fill="none" stroke="currentColor" stroke-width="1">
        <line x1="90" y1="120" x2="220" y2="80"/>
        <line x1="220" y1="80" x2="360" y2="150"/>
        <line x1="360" y1="150" x2="520" y2="70"/>
        <line x1="360" y1="150" x2="410" y2="280"/>
        <line x1="220" y1="80" x2="180" y2="260"/>
        <line x1="180" y1="260" x2="310" y2="340"/>
        <line x1="410" y1="280" x2="310" y2="340"/>
        <line x1="410" y1="280" x2="580" y2="240"/>
        <line x1="520" y1="70" x2="640" y2="160"/>
        <line x1="640" y1="160" x2="580" y2="240"/>
        <line x1="310" y1="340" x2="470" y2="430"/>
        <line x1="580" y1="240" x2="670" y2="360"/>
        <line x1="470" y1="430" x2="670" y2="360"/>
        <line x1="180" y1="260" x2="80" y2="400"/>
        <line x1="80" y1="400" x2="310" y2="340"/>
      </g>
      <g fill="currentColor">
        <circle cx="90" cy="120" r="3.5"/>
        <circle cx="220" cy="80" r="4.5"/>
        <circle cx="360" cy="150" r="5"/>
        <circle cx="520" cy="70" r="3.5"/>
        <circle cx="180" cy="260" r="4"/>
        <circle cx="410" cy="280" r="4.5"/>
        <circle cx="310" cy="340" r="5"/>
        <circle cx="580" cy="240" r="3.5"/>
        <circle cx="640" cy="160" r="3"/>
        <circle cx="470" cy="430" r="4"/>
        <circle cx="670" cy="360" r="3.5"/>
        <circle cx="80" cy="400" r="3"/>
      </g>
    </svg>
  </div>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <p class="login-brand">BERRY<span>INTELLIGENCE OS</span></p>
      <h1 id="login-title">Berry Intelligence</h1>
      <p class="login-lead">Sign in to see what matters in berry genetics and competition.</p>
      {% if error %}
        <p id="login-error" class="login-error" role="alert">{{ error }}</p>
      {% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next_path }}">
        <div class="form-field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required value="{{ username }}" {% if not username %}autofocus{% endif %} {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required {% if username %}autofocus{% endif %} {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
        </div>
        <button type="submit" class="login-submit">Sign in</button>
      </form>
      <p class="login-foot">Private analyst workspace</p>
    </section>
    <p class="login-motif-copy">Trusted intelligence</p>
  </main>
</body>
</html>
