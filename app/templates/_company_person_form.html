<form action="/companies/{{ entity_id }}/profile" method="post" class="company-editor"><input type="hidden" name="action" value="person"><input type="hidden" name="person_id" value="{{ person.id or '' }}"><input type="hidden" name="revision" value="{{ profile_override.revision }}"><label>Name<input name="name" maxlength="150" required value="{{ person.name or '' }}"></label><label>Role / note<input name="role" maxlength="150" value="{{ person.role or '' }}" placeholder="Your note about this person"></label><label>LinkedIn<input type="url" name="linkedin" value="{{ person.linkedin or '' }}"></label><label class="company-check"><input type="checkbox" name="highlighted" value="1" {% if person.highlighted %}checked{% endif %}> Highlight this person</label><label class="company-wide">Social links / handles<textarea name="socials" rows="3" placeholder="Platform | @handle | https://…">{% for link in person.socials or [] %}{{ link.platform }} | {{ link.handle or '' }} | {{ link.url }}{{ '\n' }}{% endfor %}</textarea></label><p class="company-wide company-muted">One per line: Platform | handle | URL. This contact remains a user note, separate from reviewed people and relationships.</p><button class="green-button">Save person</button></form>
